name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version separators
        shell: bash
        run: bash scripts/normalize-version.sh

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD." >&2
            echo "See the Auto Update section in README.md before publishing." >&2
            exit 1
          fi

      - name: Validate and export version
        id: version
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          cargo_version="$(awk -F '"' '/^\[package\]/{in_package=1; next} in_package && /^version = /{print $2; exit}' src-tauri/Cargo.toml)"

          if [[ -z "$app_version" || -z "$cargo_version" ]]; then
            echo "Unable to read the application version." >&2
            exit 1
          fi

          if [[ "$app_version" != "$cargo_version" ]]; then
            echo "Version mismatch: package.json=$app_version, src-tauri/Cargo.toml=$cargo_version" >&2
            echo "Run: npm run version:set -- <major.minor.patch>" >&2
            exit 1
          fi

          tag_name="v${app_version}"

          if git rev-parse --verify --quiet "refs/tags/${tag_name}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "${tag_name} already points to ${tagged_commit}; bump the application version before releasing ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=EdgeTerm v${app_version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # Nearest earlier release tag reachable from this commit. The current
          # tag is excluded so re-running a draft still diffs against the
          # previous release instead of producing an empty changelog.
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG_NAME" "$GITHUB_SHA" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            log_range="${previous_tag}..${GITHUB_SHA}"
          else
            log_range="$GITHUB_SHA"
          fi

          # One line per commit, newest first; version bumps are release
          # plumbing rather than changes worth listing.
          changelog="$(git log --no-merges --format="- %s ([%h](${repo_url}/commit/%H))" "$log_range" \
            | grep -v -E '^- chore: bump version to ' || true)"

          {
            echo "EdgeTerm v${APP_VERSION}, built from commit [\`${short_sha}\`](${repo_url}/commit/${GITHUB_SHA})."
            echo
            if [[ -n "$changelog" ]]; then
              echo "$changelog"
              echo
            fi
            if [[ -n "$previous_tag" ]]; then
              echo "**Full Changelog**: ${repo_url}/compare/${previous_tag}...${TAG_NAME}"
              echo
            fi
            echo "The application checks this release for signed updates automatically. Download the installer matching your operating system and CPU architecture for a manual installation."
            echo
            echo "No installation needed: the Windows portable zip runs from any folder and keeps all configuration in the \`data\` directory beside the executable; the Linux AppImages run in place as well."
            echo "The Linux Flatpak bundles install sandboxed copies without a repository: \`flatpak install ./EdgeTerm_*.flatpak\` (the required GNOME runtime is fetched automatically)."
          } > release-notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "${TAG_NAME} is already published; bump the application version before releasing again." >&2
              exit 1
            fi
            gh release edit "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              --draft
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            bundle_args: --bundles app,dmg
          - name: Windows x64
            platform: windows-2022
            bundle_args: --bundles nsis
            windows_arch: x64
          - name: Windows ARM64
            platform: windows-11-arm
            bundle_args: --bundles nsis
            windows_arch: arm64
          - name: Linux x64
            platform: ubuntu-22.04
            bundle_args: --bundles appimage,deb,rpm
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            bundle_args: --bundles appimage,deb,rpm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize version separators
        shell: bash
        run: bash scripts/normalize-version.sh

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail

          # The x64 hosted image prefers azure.archive.ubuntu.com through a
          # mirror list. If that endpoint accepts a connection but stops
          # responding, apt does not reliably move on to the fallback mirror.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
          fi

          run_apt() {
            local attempt
            for attempt in 1 2 3; do
              if sudo timeout --signal=TERM --kill-after=15s 10m \
                apt-get \
                  -o Acquire::Retries=3 \
                  -o Acquire::http::Timeout=30 \
                  -o Acquire::https::Timeout=30 \
                  -o Acquire::ForceIPv4=true \
                  "$@"; then
                return 0
              fi

              if [[ "$attempt" -eq 3 ]]; then
                echo "apt-get failed after ${attempt} attempts." >&2
                return 1
              fi

              echo "apt-get attempt ${attempt} failed; retrying..." >&2
              sleep $((attempt * 5))
            done
          }

          run_apt update
          run_apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove stale bundle outputs
        shell: bash
        run: |
          node -e "require('node:fs').rmSync('src-tauri/target/release/bundle', { recursive: true, force: true })"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Resolve the release by tag instead of pinning the ID from prepare:
          # if the draft is removed while the build runs, tauri-action recreates
          # it here rather than failing with a 404 on the asset upload.
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: ${{ needs.prepare.outputs.release_name }}
          releaseBody: EdgeTerm ${{ needs.prepare.outputs.app_version }} signed update.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.bundle_args }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "EdgeTerm-[version]-[platform]-[arch]-[bundle]"

      - name: Package and upload Windows portable zip
        if: startsWith(matrix.platform, 'windows-')
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
        shell: bash
        run: |
          set -euo pipefail

          # The NSIS bundle and the portable zip carry the same executable
          # (the frontend is embedded in it). The shipped data directory is
          # what switches the application into portable mode: configuration
          # is written there instead of %APPDATA% (see portable_data_dir in
          # src-tauri/src/store.rs), and the updater opens the release page
          # instead of running the installer.
          staging=portable-staging
          rm -rf "$staging"
          mkdir -p "$staging/data"
          cp src-tauri/target/release/edgeterm.exe "$staging/EdgeTerm.exe"

          # 7-Zip is on PATH on the x64 images; the arm64 image does not
          # guarantee it, so fall back to the default installation path.
          seven_zip=7z
          if ! command -v "$seven_zip" >/dev/null 2>&1; then
            seven_zip="/c/Program Files/7-Zip/7z.exe"
          fi

          {
            echo "EdgeTerm ${APP_VERSION} portable (Windows ${WINDOWS_ARCH})"
            echo
            echo "Run EdgeTerm.exe directly; nothing is installed. All configuration"
            echo "lives in the data folder next to the executable, so the whole"
            echo "folder can move between machines or live on a removable drive."
            echo "If the data folder is missing after extraction, create it: an"
            echo "empty data folder beside EdgeTerm.exe is what enables portable"
            echo "mode. Without it the app stores configuration under %APPDATA%"
            echo "like an installed copy."
            echo
            echo "Notes:"
            echo "- Requires the Microsoft Edge WebView2 runtime, preinstalled on"
            echo "  current Windows 10 and 11. If it is missing, install it from"
            echo "  https://developer.microsoft.com/microsoft-edge/webview2/"
            echo "- Saved passwords are encrypted with a machine-bound key, so"
            echo "  they do not decrypt on another machine; sessions and settings"
            echo "  travel fine."
            echo "- Updates are not installed in place: when a new version is"
            echo "  available, EdgeTerm opens the release download page and you"
            echo "  replace this folder with the new portable zip."
          } > "$staging/README.txt"

          zip_name="EdgeTerm_${APP_VERSION}_${WINDOWS_ARCH}-portable.zip"
          (cd "$staging" && "$seven_zip" a -tzip "../$zip_name" EdgeTerm.exe README.txt data)
          gh release upload "$TAG_NAME" "$zip_name" --clobber

      - name: Keep Windows portable zip as workflow artifact
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/upload-artifact@v7
        with:
          name: EdgeTerm-${{ needs.prepare.outputs.app_version }}-windows-${{ matrix.windows_arch }}-portable
          path: EdgeTerm_${{ needs.prepare.outputs.app_version }}_${{ matrix.windows_arch }}-portable.zip
          if-no-files-found: error

  flatpak:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 ships flatpak-builder 1.2, which calls the removed
          # appstream-compose tool; the GNOME 50 SDK only provides
          # `appstreamcli compose`. Ubuntu 24.04 ships flatpak-builder 1.4 and
          # matches the SDK's tooling.
          - name: Flatpak x64
            platform: ubuntu-24.04
            arch: x86_64
          - name: Flatpak ARM64
            platform: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize version separators
        shell: bash
        run: bash scripts/normalize-version.sh

      # The hosted Ubuntu images do not ship flatpak-builder. Install it and the
      # runtime/SDK as root here: flatpak-builder runs as the unprivileged
      # runner user and installs dependencies system-wide, so the build action
      # cannot fetch them on its own.
      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
          fi

          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y flatpak flatpak-builder

          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor, which prevents flatpak-builder's bwrap sandbox from
          # starting. Allow them for this throwaway runner.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50

      # The action caches .flatpak-builder, so the pinned Rust and Node tarballs
      # are only downloaded on the first run. It defaults to --arch=x86_64, so
      # the ARM job has to pass its architecture explicitly or flatpak-builder
      # refuses the mismatch.
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.edgeterm.desktop.flatpak
          manifest-path: flatpak/com.edgeterm.desktop.yml
          arch: ${{ matrix.arch }}

      - name: Smoke test the bundle
        shell: bash
        run: |
          set -euo pipefail

          # User-level install is always unprivileged. If the build ran into a
          # different installation, flatpak pulls the GNOME 50 runtime from
          # flathub automatically.
          flatpak install --user --noninteractive ./com.edgeterm.desktop.flatpak
          flatpak info --user com.edgeterm.desktop
          flatpak run --command=bash com.edgeterm.desktop -c 'test -x /app/bin/edgeterm'

      - name: Rename bundle
        shell: bash
        run: mv com.edgeterm.desktop.flatpak "EdgeTerm_${{ needs.prepare.outputs.app_version }}_${{ matrix.arch }}.flatpak"

      # The build jobs recreate a draft release if it disappeared; the flatpak
      # job uploads by tag, so it needs the same fallback before `gh release
      # upload` rather than failing with a 404.
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              exit 0
            fi

            # Another job may create the draft at the same time; ignore the
            # resulting "already exists" error and re-check on the next pass.
            gh release create "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "EdgeTerm ${APP_VERSION} signed update." \
              --draft 2>/dev/null || true
            sleep 3
          done

          gh release view "$TAG_NAME" >/dev/null

      - name: Upload bundle to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: gh release upload "$TAG_NAME" "EdgeTerm_${{ needs.prepare.outputs.app_version }}_${{ matrix.arch }}.flatpak" --clobber

      - name: Keep Flatpak bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: EdgeTerm-${{ needs.prepare.outputs.app_version }}-linux-${{ matrix.arch }}-flatpak
          path: EdgeTerm_${{ needs.prepare.outputs.app_version }}_${{ matrix.arch }}.flatpak
          if-no-files-found: error

  release:
    name: Verify and publish release
    needs:
      - prepare
      - build
      - flatpak
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Resolve draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          # A build job can recreate the draft if it vanished mid-run, so the
          # ID exported by prepare is not authoritative; resolve it by tag.
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)"
          echo "RELEASE_ID=${release_id}" >> "$GITHUB_ENV"

      - name: Generate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Every build job uploads only its own bundles and .sig files, so the
          # updater manifest is assembled here, in a single job, instead of
          # letting parallel jobs race over one shared latest.json asset.
          mkdir -p release-check/signatures

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > release-check/assets.json

          gh release download "$TAG_NAME" \
            --pattern '*.sig' \
            --dir release-check/signatures \
            --clobber

          # Keep this list grouped by platform, then by architecture, then by
          # bundle. The expected_assets arrays below mirror the same order.
          updater_targets=(
            "darwin-aarch64=EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "darwin-aarch64-app=EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "windows-x86_64=EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "windows-x86_64-nsis=EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "windows-aarch64=EdgeTerm_${APP_VERSION}_arm64-setup.exe"
            "windows-aarch64-nsis=EdgeTerm_${APP_VERSION}_arm64-setup.exe"
            "linux-x86_64=EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "linux-x86_64-appimage=EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "linux-x86_64-deb=EdgeTerm_${APP_VERSION}_amd64.deb"
            "linux-x86_64-rpm=EdgeTerm-${APP_VERSION}-1.x86_64.rpm"
            "linux-aarch64=EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "linux-aarch64-appimage=EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "linux-aarch64-deb=EdgeTerm_${APP_VERSION}_arm64.deb"
            "linux-aarch64-rpm=EdgeTerm-${APP_VERSION}-1.aarch64.rpm"
          )

          platforms='{}'
          for target in "${updater_targets[@]}"; do
            platform="${target%%=*}"
            asset_name="${target#*=}"
            signature_file="release-check/signatures/${asset_name}.sig"

            if ! asset_id="$(jq -er --arg name "$asset_name" \
              '.[] | select(.name == $name) | .id' \
              release-check/assets.json)"; then
              echo "Missing release asset for ${platform}: ${asset_name}" >&2
              exit 1
            fi

            if [[ ! -s "$signature_file" ]]; then
              echo "Missing updater signature for ${platform}: ${asset_name}.sig" >&2
              exit 1
            fi

            platforms="$(jq -c \
              --arg platform "$platform" \
              --arg url "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --rawfile signature "$signature_file" \
              '.[$platform] = { url: $url, signature: $signature }' \
              <<< "$platforms")"
          done

          jq -n \
            --arg version "$APP_VERSION" \
            --arg notes "EdgeTerm ${APP_VERSION} signed update." \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{ version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms }' \
            > release-check/latest.json

          gh release upload "$TAG_NAME" release-check/latest.json --clobber

      - name: Remove unexpected release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep this list in the same order as updater_targets: the manifest,
          # then macOS, Windows, and Linux, with each platform's bundles grouped
          # by architecture and each architecture's bundles sorted by type.
          expected_assets=(
            "latest.json"
            "EdgeTerm_${APP_VERSION}_aarch64.dmg"
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "EdgeTerm_${APP_VERSION}_x64-portable.zip"
            "EdgeTerm_${APP_VERSION}_arm64-setup.exe"
            "EdgeTerm_${APP_VERSION}_arm64-portable.zip"
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "EdgeTerm_${APP_VERSION}_amd64.deb"
            "EdgeTerm-${APP_VERSION}-1.x86_64.rpm"
            "EdgeTerm_${APP_VERSION}_x86_64.flatpak"
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "EdgeTerm_${APP_VERSION}_arm64.deb"
            "EdgeTerm-${APP_VERSION}-1.aarch64.rpm"
            "EdgeTerm_${APP_VERSION}_aarch64.flatpak"
          )

          is_expected_asset() {
            local expected
            for expected in "${expected_assets[@]}"; do
              if [[ "$1" == "$expected" ]]; then
                return 0
              fi
            done
            return 1
          }

          # Standalone .sig files are only needed to build latest.json above;
          # the published release embeds the signatures in the manifest.
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > release-check/assets.tsv

          while IFS=$'\t' read -r asset_id asset_name; do
            if ! is_expected_asset "$asset_name"; then
              echo "Deleting unexpected release asset: ${asset_name}"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < release-check/assets.tsv

      - name: Verify release assets and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            > release-check/assets.json

          # Verify the manifest that is actually attached to the release, not
          # the local copy generated above.
          gh release download "$TAG_NAME" \
            --pattern latest.json \
            --dir release-check \
            --clobber

          # Keep this list in the same order as updater_targets: the manifest,
          # then macOS, Windows, and Linux, with each platform's bundles grouped
          # by architecture and each architecture's bundles sorted by type.
          expected_assets=(
            "latest.json"
            "EdgeTerm_${APP_VERSION}_aarch64.dmg"
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
            "EdgeTerm_${APP_VERSION}_x64-portable.zip"
            "EdgeTerm_${APP_VERSION}_arm64-setup.exe"
            "EdgeTerm_${APP_VERSION}_arm64-portable.zip"
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
            "EdgeTerm_${APP_VERSION}_amd64.deb"
            "EdgeTerm-${APP_VERSION}-1.x86_64.rpm"
            "EdgeTerm_${APP_VERSION}_x86_64.flatpak"
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
            "EdgeTerm_${APP_VERSION}_arm64.deb"
            "EdgeTerm-${APP_VERSION}-1.aarch64.rpm"
            "EdgeTerm_${APP_VERSION}_aarch64.flatpak"
          )

          if [[ "$(jq 'length' release-check/assets.json)" -ne "${#expected_assets[@]}" ]]; then
            echo "Release does not contain exactly the expected assets:" >&2
            jq -r '.[].name' release-check/assets.json >&2
            exit 1
          fi

          for asset_name in "${expected_assets[@]}"; do
            if ! jq -e --arg asset_name "$asset_name" \
              'any(.[]; .name == $asset_name)' \
              release-check/assets.json >/dev/null; then
              echo "Missing release asset: ${asset_name}" >&2
              exit 1
            fi
          done

          if [[ "$(jq -r '.version' release-check/latest.json)" != "$APP_VERSION" ]]; then
            echo "latest.json version does not match ${APP_VERSION}." >&2
            exit 1
          fi

          expected_url_prefix="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/"

          verify_update() {
            local platform="$1"
            local expected_asset="$2"
            local url
            local asset_id
            local actual_asset

            if ! url="$(jq -er --arg platform "$platform" \
              '.platforms[$platform].url | select(type == "string" and length > 0)' \
              release-check/latest.json)"; then
              echo "latest.json is missing the updater URL for ${platform}." >&2
              exit 1
            fi
            if ! jq -e --arg platform "$platform" \
              '.platforms[$platform].signature | (type == "string") and (length > 0)' \
              release-check/latest.json >/dev/null; then
              echo "latest.json is missing the updater signature for ${platform}." >&2
              exit 1
            fi

            if [[ "$url" != "${expected_url_prefix}"* ]]; then
              echo "Unexpected updater URL for ${platform}: ${url}" >&2
              exit 1
            fi

            asset_id="${url#"$expected_url_prefix"}"
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "Invalid updater asset ID for ${platform}: ${asset_id}" >&2
              exit 1
            fi

            if ! actual_asset="$(jq -er --argjson asset_id "$asset_id" \
              '.[] | select(.id == $asset_id) | .name' \
              release-check/assets.json)"; then
              echo "Updater target ${platform} points to asset ${asset_id}, which is not on the release." >&2
              exit 1
            fi
            if [[ "$actual_asset" != "$expected_asset" ]]; then
              echo "Updater target ${platform} points to ${actual_asset}, expected ${expected_asset}." >&2
              exit 1
            fi
          }

          verify_update darwin-aarch64 \
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
          verify_update darwin-aarch64-app \
            "EdgeTerm_${APP_VERSION}_aarch64.app.tar.gz"
          verify_update windows-x86_64 \
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
          verify_update windows-x86_64-nsis \
            "EdgeTerm_${APP_VERSION}_x64-setup.exe"
          verify_update windows-aarch64 \
            "EdgeTerm_${APP_VERSION}_arm64-setup.exe"
          verify_update windows-aarch64-nsis \
            "EdgeTerm_${APP_VERSION}_arm64-setup.exe"
          verify_update linux-x86_64 \
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
          verify_update linux-x86_64-appimage \
            "EdgeTerm_${APP_VERSION}_amd64.AppImage"
          verify_update linux-x86_64-deb \
            "EdgeTerm_${APP_VERSION}_amd64.deb"
          verify_update linux-x86_64-rpm \
            "EdgeTerm-${APP_VERSION}-1.x86_64.rpm"
          verify_update linux-aarch64 \
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
          verify_update linux-aarch64-appimage \
            "EdgeTerm_${APP_VERSION}_aarch64.AppImage"
          verify_update linux-aarch64-deb \
            "EdgeTerm_${APP_VERSION}_arm64.deb"
          verify_update linux-aarch64-rpm \
            "EdgeTerm-${APP_VERSION}-1.aarch64.rpm"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        shell: bash
        run: |
          gh release edit "$TAG_NAME" \
            --draft=false \
            --prerelease=false \
            --latest
