# EdgeTerm — Flatpak manifest.
#
# The Rust toolchain and Node.js come from the org.freedesktop SDK extensions
# that match org.gnome.Platform//50 (freedesktop 25.08). Nothing is downloaded
# into /app at build time, so the compiler and Node versions are the ones the
# runtime was built against rather than a separately pinned tarball.
#
# Rust dependencies are vendored from src-tauri/Cargo.lock into
# dist/flatpak/cargo-sources.json by flatpak/gen-cargo-sources.sh. The build
# runs `cargo --offline`; flatpak-builder downloads the .crate archives once in
# its download phase. The manifest includes the generated file, so run
# flatpak/build.sh (or the CI generation step) before flatpak-builder directly.
app-id: com.edgeterm.desktop
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: edgeterm

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=ssh-auth
  # Serial sessions need access to USB serial devices (implies dri).
  - --device=all
  # Local shells, SSH keys and the built-in file manager operate on user files.
  - --filesystem=home
  # flatpak forces SHELL=/bin/sh in the sandbox; the app's default_shell()
  # reads $SHELL, so give local shells a proper interactive bash.
  - --env=SHELL=/bin/bash

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  build-args:
    # npm ci still fetches the locked frontend dependencies. Cargo itself is
    # offline (see CARGO_NET_OFFLINE) and only reads the vendored crates.
    - --share=network
  env:
    CARGO_HOME: /run/build/edgeterm/cargo
    CARGO_NET_OFFLINE: "true"
    npm_config_registry: https://registry.npmmirror.com
    npm_config_audit: "false"
    npm_config_fund: "false"
  # Skip flatpak-builder's debuginfo extraction at module commit: eu-strip
  # rewrites ELF files in place (hardlinked to OSTree cache objects) and
  # cannot handle rust 1.98's libLLVM layout (program headers ~134MiB into
  # the file), producing "illformed"/"no loadable segments" libraries that
  # break rustc on every subsequent checkout.
  no-debuginfo: true

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: edgeterm
    buildsystem: simple
    build-commands:
      - npm ci
      - npm run build
      # --features tauri/custom-protocol is what plain `tauri build` enables
      # automatically: without it the binary never serves the embedded dist/
      # assets and falls back to the devUrl, rendering a blank window.
      - cargo build --offline --manifest-path src-tauri/Cargo.toml --release --locked --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/edgeterm /app/bin/edgeterm
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/com.edgeterm.desktop.png
      - install -Dm644 flatpak/com.edgeterm.desktop.desktop /app/share/applications/com.edgeterm.desktop.desktop
      - install -Dm644 flatpak/com.edgeterm.desktop.metainfo.xml /app/share/metainfo/com.edgeterm.desktop.metainfo.xml
    sources:
      - type: file
        path: ../package.json
      - type: file
        path: ../package-lock.json
      - type: file
        path: ../index.html
      - type: file
        path: ../tsconfig.json
      - type: file
        path: ../tsconfig.node.json
      - type: file
        path: ../vite.config.ts
      - type: dir
        path: ../src
        dest: src
      - type: file
        path: ../src-tauri/Cargo.toml
        dest: src-tauri
        dest-filename: Cargo.toml
      - type: file
        path: ../src-tauri/Cargo.lock
        dest: src-tauri
        dest-filename: Cargo.lock
      - type: file
        path: ../src-tauri/build.rs
        dest: src-tauri
        dest-filename: build.rs
      - type: file
        path: ../src-tauri/tauri.conf.json
        dest: src-tauri
        dest-filename: tauri.conf.json
      - type: dir
        path: ../src-tauri/src
        dest: src-tauri/src
      - type: dir
        path: ../src-tauri/capabilities
        dest: src-tauri/capabilities
      - type: dir
        path: ../src-tauri/icons
        dest: src-tauri/icons
      - type: dir
        path: ../src-tauri/patches
        dest: src-tauri/patches
      - type: file
        path: com.edgeterm.desktop.desktop
        dest: flatpak
        dest-filename: com.edgeterm.desktop.desktop
      - type: file
        path: com.edgeterm.desktop.metainfo.xml
        dest: flatpak
        dest-filename: com.edgeterm.desktop.metainfo.xml
      # Generated by flatpak/gen-cargo-sources.sh into dist/flatpak
      # (gitignored): a build artifact of Cargo.lock, never committed.
      - ../dist/flatpak/cargo-sources.json
